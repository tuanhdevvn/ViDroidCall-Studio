name: Android CI / CD Pipeline

on:
  push:
    branches:
      - main
      - "feature/**"
      - "bugfix/**"
  pull_request:
    branches:
      - main

jobs:
  # 1. Kiểm tra tải và bộ nhớ đệm phụ thuộc (Dependencies Setup & Cache)
  setup-dependencies:
    name: CI / Setup & Dependencies / Cache & Verify
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: 🔑 Grant Execute Permission
        run: chmod +x gradlew

      - name: 📦 Download and Verify Dependencies
        run: ./gradlew androidDependencies --dry-run

  # 2. Kiểm tra biên dịch mã nguồn Kotlin và Bytecode (Quality & Compilation)
  quality-compile:
    name: CI / Quality CI / Kotlin Bytecode Compilation
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: 🔑 Grant Execute Permission
        run: chmod +x gradlew

      - name: 🔍 Compile Kotlin & Bytecode
        run: ./gradlew compileDebugKotlin compileDebugUnitTestKotlin

  # 3. Kiểm tra toàn bộ Unit Tests (Testing CI)
  unit-tests:
    name: CI / Testing CI / Unit Tests (Fast-Path & ITN)
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: 🔑 Grant Execute Permission
        run: chmod +x gradlew

      - name: 🧪 Execute 160 Unit Tests
        run: ./gradlew testDebugUnitTest --continue

      - name: 📊 Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 7

  # 4. Quét bảo mật phụ thuộc (Security Scan)
  security-scan:
    name: CI / Security CI / Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: 🔑 Grant Execute Permission
        run: chmod +x gradlew

      - name: 🛡️ Audit Runtime Dependencies
        run: ./gradlew app:dependencies --configuration debugRuntimeClasspath > /dev/null
