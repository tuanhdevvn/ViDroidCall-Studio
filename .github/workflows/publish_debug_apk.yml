name: Publish debug APK

on:
  workflow_dispatch:

jobs:
  upload-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle

      - name: Grant Gradle execute permission
        run: chmod +x gradlew

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      - name: Attach APK to release v1.1.2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ViDroidCall-Studio-1.1.2-debug.apk
          gh release upload v1.1.2 ViDroidCall-Studio-1.1.2-debug.apk --clobber --repo "$GITHUB_REPOSITORY"
