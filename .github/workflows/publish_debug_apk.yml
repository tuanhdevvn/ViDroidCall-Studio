name: Publish debug APK

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the APK to (e.g. v1.1.3)"
        required: true
        type: string

jobs:
  upload-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle

      - name: Grant Gradle execute permission
        run: chmod +x gradlew

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      - name: Attach APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          APK="ViDroidCall-Studio-${VERSION}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" "$APK" \
              --repo "$GITHUB_REPOSITORY" \
              --title "ViDroidCall Studio ${VERSION}" \
              --notes "Debug APK for ${TAG}."
          else
            gh release upload "$TAG" "$APK" --clobber --repo "$GITHUB_REPOSITORY"
          fi
